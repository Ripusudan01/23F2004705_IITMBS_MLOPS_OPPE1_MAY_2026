name: OPPE CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP Authentication
        run: |
          gcloud auth list

      - name: Pull DVC Data
        env:
          DVC_NO_ANALYTICS: "true"
        run: |
          dvc pull -v --jobs 1

      - name: Run Feature Sanity Tests
        run: |
          python -m pytest tests/test_features.py -v

      - name: Install CML
        uses: iterative/setup-cml@v2

      - name: Generate CML Report
        run: |
          echo "# Stock Movement Predictor CI Report" > report.md
          echo "" >> report.md
          echo "## Feature Sanity Test Results" >> report.md
          echo '```' >> report.md
          python -m pytest tests/test_features.py -v >> report.md
          echo '```' >> report.md

      - name: Comment Report on Pull Request
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md
